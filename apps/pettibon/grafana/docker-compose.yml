# Grafana on the mothership only. Reads Pettibon's sqlite. No child runs this.
# Published on 127.0.0.1:3000. The container cannot see conf/ or wallets.
services:
  grafana:
    image: grafana/grafana:11.4.0
    container_name: rimbaud-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - /home/gerdy/.config/pettibon/grafana.env
    environment:
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/trades.json
    volumes:
      - /home/gerdy/hummingbird/hummingbot/pettibon_data:/var/lib/pettibon:ro
      - ./provisioning:/etc/grafana/provisioning:ro
