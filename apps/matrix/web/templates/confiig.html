<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rimBaud // FUNDS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root {
  --bg: #07080c;
  --panel: #10131a;
  --border: #2a3344;
  --text: #d7e2f2;
  --muted: #7b889c;
  --green: #3dff9c;
  --cyan: #7ecbff;
  --gold: #f0b90b;
  --rose: #ff5d73;
  --font: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.45; }
a { color: var(--cyan); text-decoration: none; }
a:hover { color: #fff; }
header {
  border-bottom: 1px solid var(--border);
  padding: 14px 22px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  background: #0c1016;
}
.brand { font-size: 15px; font-weight: 600; letter-spacing: 2px; color: #2A9FD6; text-shadow: 0 0 12px rgba(42, 159, 214, 0.55); }
.brand span { color: var(--muted); font-weight: 400; }
.nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.nav a, .pill {
  border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 2px;
  color: var(--muted); font-size: 11px; letter-spacing: 1px;
  text-transform: uppercase;
}
.nav a.active, .nav a:hover { border-color: var(--gold); color: var(--gold); }
.pill.live { border-color: var(--green); color: var(--green); }
.pill.offline { border-color: var(--rose); color: var(--rose); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 18px 18px 48px; }
.lead { color: var(--muted); margin-bottom: 16px; max-width: 820px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  margin-bottom: 14px;
  padding: 16px;
}
.card-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 12px; }
.card-h h2 { font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; }
.meta { color: var(--muted); font-size: 11px; }
.grid {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 8px 14px;
  align-items: center;
}
@media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
label { color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
input[type=text] {
  width: 100%;
  background: #0b0e14;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 8px 10px;
}
input[type=checkbox] { transform: scale(1.15); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--cyan);
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 9px 14px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
button.primary { border-color: var(--green); color: var(--green); }
button.danger { border-color: var(--rose); color: var(--rose); }
button:disabled { opacity: 0.45; cursor: wait; }
.bal { color: var(--cyan); }
.warn { color: var(--rose); font-size: 12px; margin-top: 8px; }
.ok { color: var(--green); }
.toast {
  position: fixed; bottom: 22px; right: 22px;
  background: var(--panel); border: 1px solid var(--green);
  color: var(--green); padding: 10px 16px; display: none; max-width: 420px;
}
.toast.err { border-color: var(--rose); color: var(--rose); }
</style>
</head>
<body>
{% include '_nav.html' %}
<div class="wrap">
  <p class="lead">
    Change the Hyperliquid wallet / subaccount each bot signs for, then restart that container
    so Hummingbot reloads the encrypted connector. Same API key is kept; only the
    <code>use_vault</code> address changes. Copy stays on the main wallet unless you turn vault on.
  </p>
  <p class="lead">
    <a href="/update"><button type="button" class="primary">Update — compare to Hummingbot online</button></a>
  </p>
  <div id="bots"></div>
</div>
<div class="toast" id="toast"></div>
<script>
function showToast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isErr ? ' err' : '');
  el.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function money(n) {
  if (n == null || Number.isNaN(Number(n))) return '—';
  return '$' + Number(n).toFixed(2);
}

async function saveBot(id, restart) {
  const addr = document.getElementById('addr-' + id).value.trim();
  const vault = document.getElementById('vault-' + id).checked;
  const btns = document.querySelectorAll('[data-bot="'+id+'"]');
  btns.forEach(b => b.disabled = true);
  try {
    const r = await fetch('/api/confiig/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, address: addr, use_vault: vault, restart }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
    showToast(d.message || 'Saved');
    setTimeout(refresh, restart ? 4000 : 800);
  } catch (e) {
    showToast(e.message, true);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

async function restartBot(id) {
  if (!confirm('Restart ' + id + ' now? Open positions on the exchange are not closed.')) return;
  const btns = document.querySelectorAll('[data-bot="'+id+'"]');
  btns.forEach(b => b.disabled = true);
  try {
    const r = await fetch('/api/confiig/restart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
    showToast(d.message || 'Restarted');
    setTimeout(refresh, 4000);
  } catch (e) {
    showToast(e.message, true);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

function render(bots) {
  const box = document.getElementById('bots');
  box.innerHTML = (bots || []).map(b => {
    const live = b.running ? 'LIVE' : 'OFF';
    const pill = b.running ? 'live' : 'offline';
    const ymlOk = b.yml_exists ? 'yml ok' : 'yml missing';
    return `<div class="card">
      <div class="card-h">
        <h2>${esc(b.name)}</h2>
        <div class="meta">
          <span class="pill ${pill}">${live}</span>
          ${esc(b.container)} · ${esc(ymlOk)}
        </div>
      </div>
      <div class="grid">
        <label>Address</label>
        <input id="addr-${esc(b.id)}" type="text" value="${esc(b.address)}" spellcheck="false" />
        <label>Use vault</label>
        <label style="text-transform:none;letter-spacing:0;color:var(--text)">
          <input id="vault-${esc(b.id)}" type="checkbox" ${b.use_vault ? 'checked' : ''} />
          subaccount (vaultAddress) — leave on for Swing / Helliot / Surfn
        </label>
        <label>Live HL</label>
        <div class="bal">perp ${money(b.equity_usd)} · free ${money(b.free_usd)} · spot ${money(b.spot_usd)} · pos ${b.n_pos == null ? '—' : b.n_pos}</div>
        <label>Notes</label>
        <div class="meta">${esc(b.notes || '')}</div>
      </div>
      ${b.yml_exists ? '' : '<div class="warn">Connector file is not mounted in the dashboard container.</div>'}
      <div class="row-actions">
        <button class="primary" data-bot="${esc(b.id)}" onclick="saveBot('${esc(b.id)}', false)">Save</button>
        <button class="primary" data-bot="${esc(b.id)}" onclick="saveBot('${esc(b.id)}', true)">Save &amp; restart</button>
        <button class="danger" data-bot="${esc(b.id)}" onclick="restartBot('${esc(b.id)}')">Restart bot</button>
      </div>
    </div>`;
  }).join('') || '<p class="meta">No bots in conf/bot_accounts.json</p>';
}

async function refresh() {
  try {
    const r = await fetch('/api/confiig');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d.bots || []);
  } catch (e) {
    showToast('Load failed: ' + e.message, true);
  }
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
