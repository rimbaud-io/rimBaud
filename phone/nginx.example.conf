# Static-IP box in front of the hub (TLS). Spring stays 127.0.0.1:5004.
# Put the hub on WireGuard 10.66.80.1 so this VPS can GET torky too.
#
#   apt install caddy   OR  nginx + certbot
#
# Caddy one-liner (preferred):
#   rimbaud.example.com {
#     reverse_proxy 127.0.0.1:8787
#   }
#
# Then: GATEWAY_TOKEN=... python3 gateway.py
# iPhone Safari → https://rimbaud.example.com → Share → Add to Home Screen

server {
    listen 443 ssl http2;
    server_name YOUR.STATIC.IP;
    # ssl_certificate     /etc/letsencrypt/live/YOUR.DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR.DOMAIN/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
