# V2 standard controllers — STOPPED until WIRE place. Profile v2-sleep.
# docker compose -f docker-compose.yml -f docker-compose.v2-sleep.yml --profile v2-sleep create
# Never started by plain `docker compose up`. Empty connectors = no HL keys.
x-v2: &v2sleeper
  image: hummingbot/hummingbot:latest
  restart: "no"
  profiles: ["v2-sleep"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"
  tty: true
  stdin_open: true
  network_mode: host
  volumes:
    - ./conf:/home/hummingbot/conf
    - ./conf-v2-sleep/connectors:/home/hummingbot/conf/connectors
    - ./conf/strategies:/home/hummingbot/conf/strategies
    - ./conf/controllers:/home/hummingbot/conf/controllers
    - ./conf/scripts:/home/hummingbot/conf/scripts
    - ./logs:/home/hummingbot/logs
    - ./data:/home/hummingbot/data
    - ./certs:/home/hummingbot/certs
    - ./scripts:/home/hummingbot/scripts
    - ./controllers:/home/hummingbot/controllers
services:
  hummingbot-v2-bollinger-v1:
    <<: *v2sleeper
    container_name: hummingbot-v2-bollinger-v1
    environment:
      - CONFIG_PASSWORD=${CONFIG_PASSWORD:-Dan2Delion}
      - SCRIPT_CONFIG=v2_bollinger-v1.yml

  hummingbot-v2-bollinger-v2:
